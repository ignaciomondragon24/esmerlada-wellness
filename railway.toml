[build]
builder      = "NIXPACKS"
buildCommand = "npm install && npm run build"

[variables]
NIXPACKS_NODE_VERSION = "20"
NODE_ENV = "production"

[deploy]
startCommand        = "npm start"
healthcheckPath     = "/api/health"
healthcheckTimeout  = 30

[deploy.restartPolicy]
type       = "ON_FAILURE"
maxRetries = 3
